name: دانلودر عمومی ویدئو (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Media URL or yt-dlp extractor pseudo-URL'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      upload_method:
        description: 'Use Release for large downloads; repository stores files in Git history'
        required: true
        type: choice
        options:
          - repository
          - release
        default: repository
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: true
        type: string
        default: 'bv*+ba/b'
      download_playlist:
        description: 'Download playlist when the URL also identifies a single video'
        required: false
        type: boolean
        default: false
      archive_name:
        description: 'Base name for the 7z archive (if file is split)'
        required: false
        type: string
        default: 'video'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate upload method
        env:
          UPLOAD_METHOD: ${{ inputs.upload_method }}
        run: |
          case "$UPLOAD_METHOD" in
            repository|release) ;;
            *) echo "::error::Invalid upload method"; exit 1 ;;
          esac

      - name: Validate inputs
        if: inputs.upload_method != 'release'
        env:
          FOLDER: ${{ inputs.output_folder }}
        run: |
          python3 scripts/validate_workflow.py --folder "$FOLDER"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install yt-dlp and 7-Zip
        run: |
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]"
          python -m yt_dlp --version
          # PornHub's extractor uses impersonation selectively; fail early if
          # the optional transport is unavailable instead of retrying 403s.
          python -m yt_dlp --list-impersonate-targets | grep -q 'curl_cffi'
          sudo apt-get update && sudo apt-get install -y p7zip-full ffmpeg

      - name: Validate media URL
        env:
          URL: ${{ inputs.url }}
        run: python3 scripts/validate_ytdlp_input.py "$URL"

      - name: Download video (retry up to 5 times)
        id: download
        env:
          WF_GITHUB_EVENT_INPUTS_OUTPUT_FOLDER: ${{ github.event.inputs.output_folder }}
          WF_GITHUB_EVENT_INPUTS_QUALITY: ${{ github.event.inputs.quality }}
          WF_GITHUB_EVENT_INPUTS_URL: ${{ github.event.inputs.url }}
          WF_DOWNLOAD_PLAYLIST: ${{ inputs.download_playlist }}
          SECRET_YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          FOLDER="$RUNNER_TEMP/meli-video"
          mkdir -p "$FOLDER"
          LIST="$RUNNER_TEMP/meli-video-output.txt"
          SUCCESS=false
          PLAYLIST_ARGS=(--no-playlist)
          if [ "${WF_DOWNLOAD_PLAYLIST:-false}" = true ]; then
            PLAYLIST_ARGS=(--yes-playlist)
          fi
          COOKIE_ARGS=()
          COOKIE_FILE=""
          trap 'if [ -n "$COOKIE_FILE" ]; then rm -f -- "$COOKIE_FILE"; fi' EXIT
          if [ -n "${SECRET_YTDLP_COOKIES:-}" ]; then
            umask 077
            COOKIE_FILE=$(mktemp "$RUNNER_TEMP/meli-ytdlp-cookies.XXXXXX")
            printf '%s' "$SECRET_YTDLP_COOKIES" > "$COOKIE_FILE"
            COOKIE_ARGS=(--cookies "$COOKIE_FILE")
            unset SECRET_YTDLP_COOKIES
          fi
          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt/5"
            rm -f -- "$LIST"
            if yt-dlp \
              --output "$FOLDER/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "$WF_GITHUB_EVENT_INPUTS_QUALITY" \
              --ignore-config --js-runtimes node --restrict-filenames \
              "${PLAYLIST_ARGS[@]}" "${COOKIE_ARGS[@]}" \
              --retries 3 --fragment-retries 10 --no-color --newline \
              --print-to-file 'after_move:filepath' "$LIST" \
              -- "$WF_GITHUB_EVENT_INPUTS_URL"; then
              if [ -f "$LIST" ]; then
                mapfile -t completed < "$LIST"
                if [ "${#completed[@]}" -gt 0 ]; then
                  SUCCESS=true
                  break
                fi
              fi
              echo "No completed files were returned by yt-dlp"
            fi
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ "$SUCCESS" != true ]; then
            echo "::error::All download attempts failed"; exit 1
          fi
          # Accept every completed entry, but never trust output paths outside
          # the dedicated download directory. Keep only reported regular files.
          python3 - "$FOLDER" "$LIST" "$RUNNER_TEMP/meli-video-manifest.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json
          from pathlib import Path
          import sys

          folder = Path(sys.argv[1]).resolve()
          entries = Path(sys.argv[2]).read_text(encoding='utf-8').splitlines()
          files = []
          for entry in entries:
              path = Path(entry)
              if (not path.is_absolute() or path.parent != folder or path.is_symlink()
                      or not path.is_file() or path.resolve().parent != folder
                  or any(ord(c) < 32 or ord(c) == 127 for c in path.name)):
                  raise SystemExit('::error::Unexpected or missing output path from yt-dlp')
              if path.name not in files:
                  files.append(path.name)
          if not files:
              raise SystemExit('::error::No completed files returned by yt-dlp')
          for path in folder.iterdir():
              if path.name not in files:
                  if path.is_symlink() or path.is_file():
                      path.unlink()
                  else:
                      raise SystemExit('::error::Unexpected directory in download output')
          Path(sys.argv[3]).write_text(json.dumps(files, ensure_ascii=True), encoding='utf-8')
          with open(sys.argv[4], 'a', encoding='utf-8') as out:
              print(f'filename={files[0]}', file=out)
              print(f'size_bytes={(folder / files[0]).stat().st_size}', file=out)
              print(f'is_collection={str(len(files) > 1).lower()}', file=out)
          print(f'Completed {len(files)} file(s)')
          PYCODE
        shell: bash

      - name: Conditional split (if file > 99 MB)
        id: split
        env:
          WF_GITHUB_EVENT_INPUTS_OUTPUT_FOLDER: ${{ github.event.inputs.output_folder }}
          WF_STEPS_DOWNLOAD_OUTPUTS_FILENAME: ${{ steps.download.outputs.filename }}
          WF_STEPS_DOWNLOAD_OUTPUTS_SIZE_BYTES: ${{ steps.download.outputs.size_bytes }}
          WF_GITHUB_EVENT_INPUTS_ARCHIVE_NAME: ${{ github.event.inputs.archive_name }}
          WF_IS_COLLECTION: ${{ steps.download.outputs.is_collection }}
        run: |
          if [ "${WF_IS_COLLECTION:-false}" = true ]; then
            echo "Collection items will be split individually during publication."
            exit 0
          fi
          FOLDER="$RUNNER_TEMP/meli-video"
          FILENAME="${WF_STEPS_DOWNLOAD_OUTPUTS_FILENAME}"
          SIZE_BYTES="${WF_STEPS_DOWNLOAD_OUTPUTS_SIZE_BYTES}"
          cd "$FOLDER"

          if [ "$SIZE_BYTES" -gt $((99 * 1024 * 1024)) ]; then
            echo "File exceeds 99 MiB – splitting into 95 MiB 7z parts."
            # Append a random 6‑character hex suffix to avoid name collisions
            RANDOM_HEX=$(openssl rand -hex 3)
            [[ "$WF_GITHUB_EVENT_INPUTS_ARCHIVE_NAME" =~ ^[a-zA-Z0-9_-]{1,100}$ ]] || { echo "::error::Invalid archive name"; exit 1; }
            ARCHIVE_NAME="${WF_GITHUB_EVENT_INPUTS_ARCHIVE_NAME}_${RANDOM_HEX}"
            echo "Archive base name: ${ARCHIVE_NAME}"
            7z a -v95m -mx=9 -mmt=2 -md=64m "${ARCHIVE_NAME}.7z" -- "$FILENAME"
            rm -- "$FILENAME"   # Remove original file after successful split
            echo "split_done=true" >> $GITHUB_OUTPUT
            echo "Split completed. Parts created:"
            ls -lh "${ARCHIVE_NAME}.7z"*
          else
            echo "File is at most 99 MiB – keeping original file (no archive)."
            echo "split_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to repository
        if: inputs.upload_method != 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WF_GITHUB_EVENT_INPUTS_OUTPUT_FOLDER: ${{ github.event.inputs.output_folder }}
          WF_STEPS_DOWNLOAD_OUTPUTS_FILENAME: ${{ steps.download.outputs.filename }}
          WF_IS_COLLECTION: ${{ steps.download.outputs.is_collection }}
          WF_ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          FOLDER="${WF_GITHUB_EVENT_INPUTS_OUTPUT_FOLDER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${WF_IS_COLLECTION:-false}" = true ]; then
            python3 scripts/publish_ytdlp_collection.py "$RUNNER_TEMP/meli-video" \
              "$RUNNER_TEMP/meli-video-manifest.json" "$FOLDER" "$WF_ARCHIVE_NAME"
          else
            python3 scripts/publish_grouped.py "$RUNNER_TEMP/meli-video" "$FOLDER" --name "$WF_STEPS_DOWNLOAD_OUTPUTS_FILENAME"
          fi
          git add -- "$FOLDER/"
          python3 scripts/check_staged_sizes.py
          git diff --cached --quiet || git commit -m "Add downloaded video(s) [skip ci]"
          bash scripts/push_current_branch.sh

      - name: Prepare flat Release assets
        if: inputs.upload_method == 'release'
        env:
          WF_IS_COLLECTION: ${{ steps.download.outputs.is_collection }}
          WF_ARCHIVE_NAME: ${{ inputs.archive_name }}
        shell: bash
        run: |
          RELEASE_DIR="$RUNNER_TEMP/meli-release"
          if [ "${WF_IS_COLLECTION:-false}" = true ]; then
            python3 scripts/publish_ytdlp_collection.py "$RUNNER_TEMP/meli-video" \
              "$RUNNER_TEMP/meli-video-manifest.json" "$RELEASE_DIR" "$WF_ARCHIVE_NAME" --flat
          else
            mkdir "$RELEASE_DIR"
            shopt -s nullglob
            files=("$RUNNER_TEMP/meli-video/"*)
            [ "${#files[@]}" -gt 0 ] || { echo "::error::No completed assets to release"; exit 1; }
            for file in "${files[@]}"; do
              [ -f "$file" ] && [ ! -L "$file" ] || { echo "::error::Invalid Release asset"; exit 1; }
              ln -- "$file" "$RELEASE_DIR/"
            done
          fi
          shopt -s nullglob
          assets=("$RELEASE_DIR/"*)
          [ "${#assets[@]}" -gt 0 ] && [ "${#assets[@]}" -le 1000 ] || {
            echo "::error::A Release must contain 1 to 1000 assets"; exit 1;
          }
          for asset in "${assets[@]}"; do
            [ -f "$asset" ] && [ ! -L "$asset" ] && [ "$(stat -c %s -- "$asset")" -lt $((2 * 1024 * 1024 * 1024)) ] || {
              echo "::error::Release assets must be regular files smaller than 2 GiB"; exit 1;
            }
          done

      - name: Upload to GitHub Releases
        if: inputs.upload_method == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ format('yt-dlp-{0}-{1}', github.run_id, github.run_attempt) }}
          target_commitish: ${{ github.sha }}
          name: yt-dlp Download
          draft: true
          body: 'Downloaded media and archive volumes. Keep all volumes together to extract them.'
          files: ${{ runner.temp }}/meli-release/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish completed GitHub Release
        if: inputs.upload_method == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ format('yt-dlp-{0}-{1}', github.run_id, github.run_attempt) }}
        run: gh release edit "$RELEASE_TAG" --draft=false
